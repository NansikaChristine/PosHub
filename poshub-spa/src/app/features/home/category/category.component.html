<div class="mt-3 flex gap-2">
  <input *ngIf="currentClient.authorized" type="text" [(ngModel)]="categoryPosRef" placeholder="Enter Pos Reference Id"
    class="form-control" style="display:inline-block; width: 200px; margin-right: 10px;" />
  <button *ngIf="currentClient.authorized" class="btn btn-danger"
    (click)="deleteCatalogCategoryByPosRefId(categoryPosRef)">
    Delete Category by PosRefId
  </button>
</div>
