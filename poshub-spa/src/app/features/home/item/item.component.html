<div class="actions mb-3">
  <button *ngIf="currentClient.authorized" class="btn btn-primary" (click)="getCatalogProducts('1')">
    Get Products
  </button>
</div>

<!-- Products Table -->
<div class="table-responsive" *ngIf="showProductsTable && products.length > 0">
  <table class="table table-hover table-striped align-middle shadow-sm rounded">
    <thead class="table-header">
      <tr>
        <th>Pos Reference</th>
        <th>Name</th>
        <th>Description</th>
        <th>Price</th>
        <th>Show Online</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.posReference }}</td>
        <td>{{ product.name }}</td>
        <td class="desc-width">{{ product.description }}</td>
        <td>{{ product.price | currency }}</td>
        <td>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="product.showOnline" disabled>
            <span class="slider round"></span>
          </label>
        </td>
        <td>
        <button class="btn btn-primary btn-sm me-2" style="font-size: 10px !important;" type="button"
          (click)="selectProduct(product)">
          <i class="fa fa-edit"></i>
        </button>
        <button class="btn btn-danger btn-sm" type="button" (click)="deleteCatalogProductsByPosRefId(product)">
          <i class="fa fa-trash"></i>
        </button>
      </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Edit Form -->
<div *ngIf="showProductsEdit" class="edit-form">
  <form>
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Pos Reference No</label>
        <input type="text" class="form-control" [(ngModel)]="selectedProduct.posReference" name="posReference" readonly>
      </div>
      <div class="col-md-4 d-flex align-items-center">
        <label class="switch">Show Online</label>
        <input type="checkbox" [(ngModel)]="selectedProduct.showOnline">
      </div>
      <div class="col-md-4">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" [(ngModel)]="selectedProduct.name" name="name" readonly>
      </div>
    </div>

    <div class="mt-3 text-center">
      <button type="button" class="btn btn-primary me-2" (click)="updateProduct()">Save</button>
      <button type="button" class="btn btn-secondary" (click)="clearProduct()">Cancel</button>
    </div>
  </form>
</div>
