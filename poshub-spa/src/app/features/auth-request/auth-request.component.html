<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-lg font-semibold">All Applications</h2>
    <input type="text" name="s" autocomplete="off" [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()"
      placeholder="Search" class="border rounded px-4 py-2" />
  </div>

  <div class="grid grid-cols-2 gap-6">
    <div *ngFor="let client of filteredClientDetails" class="container mt-4 p-4 border rounded shadow-sm">
      <div class="flex items-center mb-2">
        <!-- <img
          src="assets/app-placeholder.png"
          alt="App"
          class="w-12 h-12 opacity-30 mr-3"
        /> -->
        <div>
          <h3 class="font-bold">{{ client.clientName }}</h3>
          <p *ngIf="client.authorized" class="text-sm text-gray-500">Authorized At: {{ client.updatedAt | date:'short'
            }}</p>
        </div>
      </div>

      <div class="mt-3 flex gap-2">
        <button *ngIf="!client.authorized" class="btn btn-success" (click)="authorize(client)">Authorize</button>
        <button *ngIf="client.authorized" class="btn btn-danger btn-sm me-2" type="button" (click)="deleteAuthorize(client)">
          <i class="fa fa-trash"></i>
        </button>
        <button *ngIf="client.authorized" class="btn btn-success me-2"
          (click)="syncCatalogToPosHub(client.applicationId)">Sync Catalog</button>
          &nbsp;
        <button *ngIf="client.authorized" class="btn btn-warning"
          (click)="view(client)">View Catalog</button>
      </div>
    </div>
  </div>

  <div *ngIf="filteredClientDetails.length === 0" class="mt-4 text-gray-500">
    No applications found.
  </div>
</div>
